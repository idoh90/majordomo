# Keep the registry awake.
#
# Supabase pauses a free-tier project after ~7 days without activity, and a
# paused project's API hostname STOPS RESOLVING ALTOGETHER. That failure is
# indistinguishable from "the project was deleted" — it cost an evening once
# already, diagnosed as a missing backend when the data was sitting safely
# behind a sleeping hostname.
#
# It is a particularly bad fit for this app: "offline is the point" means going
# a week without opening it is a SUPPORTED use, not neglect. The very trip the
# app is designed for is the one that puts the backend to sleep.
#
# So: two real database queries a day, one per front door the project now
# serves. It is the same Supabase project either way — one probe would be
# enough to keep the hostname resolving — but see the note on the second probe
# below for why both are here anyway.
#
# Each must reach Postgres, not just the gateway — a 401 at the edge may never
# touch the database and so may not count as activity.
#
# CAVEAT worth knowing: GitHub disables scheduled workflows in repos with no
# commits for 60 days. An actively-developed repo is fine; a dormant one could
# still let the project slip under. If this repo ever goes quiet for months,
# check the project rather than assuming this has it covered.

name: Keep Supabase awake

on:
  schedule:
    # 06:00 UTC daily. Daily rather than weekly on purpose — the job is free and
    # takes seconds, and the margin matters more than the saving.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

# This job checks out nothing, reads nothing and writes nothing. Its sibling
# already says so explicitly; saying it here too means a future step that wants
# a token has to ask for it in the diff, where it can be seen.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          # The project URL is public (it ships in the browser bundle). The anon
          # key is public BY DESIGN too — row-level security is the guard, not
          # secrecy — but it lives in a repo secret anyway so rotating it is one
          # dashboard edit rather than a commit.
          SUPABASE_URL: https://xigbgvuakguqmfulfaqe.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::SUPABASE_ANON_KEY is not set. Add it under Settings → Secrets and variables → Actions."
            echo "Without it this job cannot run a query, and the project will pause."
            exit 1
          fi

          # A probe passes on two counts, not one: the query RAN (HTTP 200), and
          # it returned WHAT IT SHOULD HAVE. The second half is new, and it is the
          # difference between a keep-alive and an alarm — the app's probe asks an
          # RLS-guarded table for a row as an anonymous caller, so the only
          # correct answer is none. Row-level security on and row-level security
          # off both produced HTTP 200 and a green tick, and the evidence was
          # printed into this log every morning for nobody.
          #
          # Anything else means the registry is not answering the way it should —
          # fail LOUDLY, because a keep-alive that quietly stops working is worse
          # than not having one at all.
          # A failing probe records its failure and the next one still runs.
          #
          # It used to `exit 1` on the spot, under `set -e`, which meant the
          # app's probe failing took the whole job down BEFORE the waitlist's
          # probe was ever attempted. Both doors are on the same paused
          # hostname, so the common case was a report naming one of the two
          # things that were broken — and the waitlist's probe is the only
          # daily check that the public signup path exists at all.
          #
          # `curl` failing outright (DNS gone, which is exactly what a paused
          # project looks like) also used to abort the script before the status
          # could be printed. It is caught now and reported as 000, which is the
          # single most diagnostic line this job can produce.
          fails=0

          # THE BODY IS NEVER PRINTED. It used to be, on every run, and that was
          # two mistakes at once: nobody read it, so the one line that could have
          # said "row-level security is off" scrolled past every morning
          # unexamined — and on the day it IS off, the body is real household
          # records being written into a build log. So the job reads it instead,
          # and reports only its size and its verdict.
          probe() {
            local label="$1" method="$2" url="$3" expect="$4"
            shift 4

            local status
            status=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
              --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
              -X "${method}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              "$@" \
              "${url}") || status="000"

            local bytes
            bytes=$(wc -c < /tmp/body.txt 2>/dev/null || echo 0)
            echo "${label}: HTTP ${status} (${bytes} bytes)"

            if [ "${status}" != "200" ]; then
              if [ "${status}" = "000" ]; then
                echo "::error::${label} got no answer at all — no DNS, no TLS, or a timeout. A paused Supabase project stops resolving entirely, and this is what that looks like."
              else
                echo "::error::${label} answered ${status}, not 200. The project may be paused, the key may be wrong, or the thing being queried may be gone."
              fi
              fails=$((fails + 1))
              return
            fi

            # A 200 only proves the query RAN. What it returned is the part that
            # says whether the door is shut, and until now nothing looked.
            if [ "${expect}" = "empty" ]; then
              local body
              body=$(tr -d ' \n\r\t' < /tmp/body.txt)
              if [ "${body}" != "[]" ]; then
                echo "::error::${label} RETURNED ROWS TO AN ANONYMOUS CALLER. Row-level security is off on that table, or its policy no longer constrains — every record in it is readable by anyone holding the anon key, which ships in the browser bundle and is public by design. Re-run supabase/migrations/0001_records.sql and check 'alter table … enable row level security' actually took. The rows themselves are deliberately not printed here."
                fails=$((fails + 1))
              else
                echo "  ${label}: row-level security holds — no rows for an anonymous caller."
              fi
            fi
          }

          # The app's path. `select=id&limit=1` on an RLS-guarded table returns
          # [] for an anonymous caller and is the cheapest thing that genuinely
          # runs a query.
          # `expect=empty` is the assertion: RLS must return [] here. `select=id`
          # keeps the blast radius small even on the day it fails — an id is the
          # least revealing column on the table.
          probe "the app" GET "${SUPABASE_URL}/rest/v1/records?select=id&limit=1" empty

          # The landing page's path — the exact call src/lib/waitlist.ts makes
          # for its counter, in the landing repo.
          #
          # The hostname is shared, so this is not really a second keep-alive.
          # It is a CANARY, and that is the point: it is the only daily check
          # that the waitlist table, its SECURITY DEFINER counter, and anon's
          # execute grant all still exist. Without it, dropping any one of them
          # surfaces as a public signup form answering 404 to strangers, with
          # an error message no visitor could act on, discovered whenever
          # somebody happens to look. With it, this job goes red the next
          # morning and says which door stopped answering.
          # No `expect` here: this one is SUPPOSED to answer an anonymous caller —
          # it is a public signup counter, and returning a number to a stranger is
          # the feature. Only that it answers 200 is checked.
          probe "the waitlist" POST "${SUPABASE_URL}/rest/v1/rpc/waitlist_count" any \
            -H "Content-Type: application/json" \
            -d '{}'

          if [ "${fails}" -ne 0 ]; then
            echo "::error::${fails} of 2 doors did not answer. See the errors above for which."
            exit 1
          fi

          echo "The registry is awake, both doors answer, and the app's door is still shut to strangers."
