<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- maximum-scale + user-scalable=no: the app is an installed instrument,
         not a document, and a stray pinch on the Workshop's board or the
         Manor's week left the whole page scaled with no obvious way back.
         Zooming lives INSIDE the board, on desktop, where it has controls and
         a reset. Note this is the one accessibility trade the app makes; text
         still scales with the OS setting, which is the thing most people
         actually rely on. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c1017" />
    <meta name="description" content="Majordomo — the calendar that survives your schedule" />
    <!-- the manifest link + service-worker registration are injected at build
         time by vite-plugin-pwa (see vite.config.ts) -->
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <!-- iOS reads the manifest for display mode only from 15.4; these keep the
         standalone launch (and the dark status bar over the masthead) honest
         on older iPhones. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Majordomo" />
    <title>Majordomo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
