    <!-- The privacy policy /privacy replaced, kept word for word at the address
         of its own last-updated date. It is READABLE and deliberately not
         FINDABLE: a search for the privacy policy must land on the one that
         applies, never on a version that no longer does — so this document
         says noindex, carries no canonical (the escape hatch vite.config.ts
         allows a page that declares itself noindex; see NOINDEX there), and
         stays out of sitemap.xml.

         `follow`, like 404.html: the links out of here go to the current
         documents, and a crawler is welcome to walk back to them. -->
    <meta name="robots" content="noindex, follow" />
