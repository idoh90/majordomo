<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      THE 404 — what the estate says at an address it does not keep.

      Deliberately SELF-CONTAINED, on the same principle as `BootFailure.tsx`:
      a page whose whole job is to speak when a request found nothing must not
      depend on the thing that just failed. Every rule and every glyph is in
      this file — no stylesheet, no font, no image, no bundle. `base: './'`
      means the app's relative asset paths resolve against whatever bogus depth
      the visitor typed (`/a/b/c` would look for `/a/b/assets/…`), so a linked
      stylesheet would be a second 404 on the 404. The tokens below are copied
      from the three preset bundles in `src/core/ui/index.css`.

      Two things ARE fetched, both by absolute path so the typed depth cannot
      reach them, and both optional — the page is complete before either
      arrives: the favicon, and `/404.js`, which is a file rather than an inline
      block because `script-src 'self'` would drop an inline one without a
      sound. See the note at the head of that file.

      The copy is duplicated from `src/core/voice/` rather than read from it,
      under the exception `index.html`'s Open Graph block already claims: static
      HTML is served before any JavaScript runs, so nothing here can import a
      pack. It is written to the same register (playbook Appendix B) — dry, one
      sentence-final "sir", fact then remedy, never begs — and a voice change
      has to be carried across by hand.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Zoom is allowed here, unlike the app's own viewport tag. The app locks it
      because a stray pinch on the Workshop board or the Manor week stranded the
      whole page; this page has no board to protect, and pinching an error
      message is exactly the moment someone needs to.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1017" />
    <meta name="robots" content="noindex, nofollow" />
    <title>No such room · Majordomo</title>
    <style>
      /* Midnight is the default palette, exactly as it is in the app's @theme
         block; Terminal and Aurora re-declare it below. Only the tokens this
         page actually reads are carried over — the rest would be dead weight
         and one more thing to drift. */
      :root {
        --bg: #0c1017;
        --panel: #111826;
        --trough: #0b1017;
        --trough-line: #1a2130;
        --line: #1e2739;
        --ink: #e6ebf2;
        --ink-dim: #8b97a8;
        --ink-faint: #5e6a7d;
        --accent: #7da7d0;
        --w-watch: #7da7d0;
        --w-grounds: #68b984;
        --w-study: #a78bda;

        --font-display: 'Big Shoulders', 'Arial Narrow', system-ui, sans-serif;
        --font-body: 'Source Sans 3', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, 'IBM Plex Mono', SFMono-Regular, Menlo, Consolas, monospace;

        color-scheme: dark;
      }

      html[data-skin='terminal'] {
        --bg: #000000;
        --panel: #0a0f0c;
        --trough: #000000;
        --trough-line: #18251c;
        --line: #1c2b20;
        --ink: #d9efe2;
        --ink-dim: #6f8a78;
        --ink-faint: #51655a;
        --accent: #3fe0a8;
        --w-watch: #4dd8d8;
        --w-grounds: #6fe07f;
        --w-study: #9d8cff;
      }

      html[data-skin='aurora'] {
        --bg: #131022;
        --panel: #1a1630;
        --trough: #120f21;
        --trough-line: #282247;
        --line: #2e2752;
        --ink: #ece7f7;
        --ink-dim: #9a91b5;
        --ink-faint: #6b6389;
        --accent: #b294f5;
        --w-watch: #8ea8e8;
        --w-grounds: #74c9a2;
        --w-study: #b294f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        /* the accent bloom the app's lit panels carry, at page scale */
        background-image: radial-gradient(
          ellipse 70% 45% at 50% 0%,
          color-mix(in srgb, var(--accent) 7%, transparent),
          transparent 70%
        );
        background-repeat: no-repeat;
      }

      /* ── the masthead, as the app wears it ───────────────────────────── */
      .masthead {
        width: 100%;
        max-width: 560px;
        text-align: center;
      }
      .wordmark {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 15px;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        /* tracking pads the right edge; pull it back so the word sits centred */
        text-indent: 0.3em;
        color: var(--ink);
      }
      .masthead .sub {
        margin-top: 7px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-dim);
      }

      /* ── the panel ───────────────────────────────────────────────────── */
      .panel {
        position: relative;
        overflow: hidden;
        width: 100%;
        max-width: 560px;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px 22px 24px;
        /* the app's .panel-lit: an accent hairline along the top edge and a
           bloom in one corner. Copied rather than imported — see the note at
           the top of this file. One `background` shorthand, not a colour plus
           a `background-image`: per-layer position/size (`top / 100% 1px`) is
           only legal in the shorthand, and splitting it silently voids the
           whole declaration — hairline, bloom and all. */
        background:
          linear-gradient(
              90deg,
              transparent,
              color-mix(in srgb, var(--accent) 80%, transparent),
              transparent
            )
            top / 100% 1px no-repeat,
          radial-gradient(
            ellipse 40% 60% at 100% 0%,
            color-mix(in srgb, var(--accent) 10%, transparent),
            transparent 70%
          ),
          var(--panel);
        animation: rise 320ms cubic-bezier(0.22, 0.9, 0.3, 1) both;
      }

      /* Entrance animations start from a visible state on purpose (the same
         rule the app's own keyframes follow): if this never runs — frozen
         compositor, exotic browser — the message is still on screen. */
      @keyframes rise {
        from {
          transform: translateY(10px);
          opacity: 0.55;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 7px;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 11px;
        line-height: 1.5;
        text-transform: uppercase;
        letter-spacing: 0.24em;
        color: var(--ink-dim);
      }
      .eyebrow::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--accent);
        flex: none;
      }

      /* ── the week, with a hole in it ─────────────────────────────────── */
      .week {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        height: 78px;
        margin: 16px 0 20px;
        /* hour rules, so the strip reads as a grid with blocks on it rather
           than as a bar chart */
        background:
          repeating-linear-gradient(
            180deg,
            var(--trough-line) 0 1px,
            transparent 1px 19.5px
          ),
          var(--trough);
        border: 1px solid var(--trough-line);
        border-radius: 10px;
        overflow: hidden;
      }
      .day {
        position: relative;
        border-right: 1px solid var(--trough-line);
      }
      .day:last-child {
        border-right: 0;
      }
      .blk {
        position: absolute;
        left: 3px;
        right: 3px;
        border-radius: 3px;
        background: color-mix(in srgb, var(--blk) 26%, transparent);
        border-left: 2px solid var(--blk);
      }
      /* the slot that was asked for and does not exist */
      .gap {
        position: absolute;
        inset: 10px 3px;
        border-radius: 3px;
        border: 1px dashed color-mix(in srgb, var(--accent) 55%, transparent);
        background: color-mix(in srgb, var(--accent) 5%, transparent);
        animation: breathe 3.2s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      /* ── the message ─────────────────────────────────────────────────── */
      .say {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .fig {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(52px, 16vw, 82px);
        line-height: 0.82;
        letter-spacing: 0.02em;
        color: color-mix(in srgb, var(--accent) 26%, transparent);
        flex: none;
      }
      h1 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(21px, 5.5vw, 27px);
        line-height: 1.15;
        letter-spacing: 0.01em;
        color: var(--ink);
      }
      .say p {
        margin: 9px 0 0;
        font-size: 14.5px;
        line-height: 1.55;
        color: var(--ink-dim);
      }

      /* ── what was asked for ──────────────────────────────────────────── */
      .asked {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 20px;
        padding: 10px 12px;
        background: var(--trough);
        border: 1px solid var(--trough-line);
        border-radius: 10px;
        min-width: 0;
      }
      /* an author `display` beats the UA's `[hidden] { display: none }`, so the
         attribute needs saying again or the row shows up empty */
      .asked[hidden] {
        display: none;
      }
      .asked .label {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--ink-faint);
        flex: none;
      }
      .asked code {
        font-family: var(--font-mono);
        font-size: 12.5px;
        color: var(--ink-dim);
        /* a long path scrolls inside its own box — it never widens the panel */
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: thin;
        min-width: 0;
      }

      /* ── the door back ───────────────────────────────────────────────── */
      .door {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 100%;
        margin-top: 18px;
        padding: 13px 20px;
        background: var(--accent);
        color: var(--bg);
        border-radius: 12px;
        box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 35%, transparent);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        text-decoration: none;
        transition: filter 150ms;
      }
      .door:hover {
        filter: brightness(1.08);
      }
      .door:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      .door svg {
        flex: none;
      }

      .footnote {
        max-width: 560px;
        text-align: center;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--ink-faint);
      }

      @media (max-width: 380px) {
        .say {
          gap: 12px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
    <!--
      The page's only script, and the only thing on it fetched over the network.
      External and absolute because `script-src 'self'` would drop an inline
      block silently — see the note at the head of `public/404.js`. Synchronous
      on purpose: it sets the skin, and a deferred one would paint Midnight
      first. Everything it does is an enhancement; the page is complete without
      it.
    -->
    <script src="/404.js"></script>
  </head>
  <body>
    <div class="masthead">
      <div class="wordmark">MAJORDOMO</div>
      <div class="sub">The house is in order</div>
    </div>

    <main class="panel">
      <div class="eyebrow">Error 404 · Not in the house</div>

      <!-- The week as the Manor draws it, with the requested hour missing.
           Decorative: the message below says the same thing in words. -->
      <div class="week" aria-hidden="true">
        <div class="day">
          <div class="blk" style="--blk: var(--w-watch); top: 8px; height: 34px"></div>
        </div>
        <div class="day">
          <div class="blk" style="--blk: var(--w-grounds); top: 30px; height: 22px"></div>
        </div>
        <div class="day">
          <div class="blk" style="--blk: var(--w-watch); top: 44px; height: 26px"></div>
        </div>
        <div class="day"><div class="gap"></div></div>
        <div class="day">
          <div class="blk" style="--blk: var(--w-study); top: 16px; height: 20px"></div>
        </div>
        <div class="day">
          <div class="blk" style="--blk: var(--w-grounds); top: 38px; height: 24px"></div>
        </div>
        <div class="day">
          <div class="blk" style="--blk: var(--w-watch); top: 12px; height: 40px"></div>
        </div>
      </div>

      <div class="say">
        <div class="fig" aria-hidden="true">404</div>
        <div>
          <h1>No such room, sir.</h1>
          <p>
            Nothing in the estate answers to that address. The Manor is the way back — every wing
            opens from there.
          </p>
        </div>
      </div>

      <!-- filled in by script; empty (and hidden) if the path can't be read -->
      <div class="asked" id="asked" hidden>
        <span class="label">Requested</span>
        <code id="path"></code>
      </div>

      <a class="door" href="/">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M19 12H5m0 0 6-6m-6 6 6 6"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Return to the Manor
      </a>
    </main>

    <p class="footnote">
      Your records are untouched. They live on this device, not at that address.
    </p>
  </body>
</html>
